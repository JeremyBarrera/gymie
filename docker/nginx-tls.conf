# TLS server block for the DuckDNS + Let's Encrypt deployment (Phase 10).
# Used by the webserver service when the `https` compose profile is active:
# certificates are issued/renewed by the certbot sidecar into the shared
# `certbot` volume; the ACME http-01 challenge is served from webroot.

server {
    listen 80;
    server_name ${DUCKDNS_DOMAIN}.duckdns.org;

    # ACME challenge for issuance/renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${DUCKDNS_DOMAIN}.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/${DUCKDNS_DOMAIN}.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DUCKDNS_DOMAIN}.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/public;
    index index.php;

    client_max_body_size 20m;

    charset utf-8;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Reverb websocket upgrades (wss://domain/app/...).
    location /app/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
