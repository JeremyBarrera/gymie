# Nginx front for the Gymie docker stack: PHP-FPM to the `app` service,
# Reverb websocket upgrades under /app, generous upload limit for member
# photos. TLS termination (DuckDNS + Let's Encrypt) lives in nginx-tls.conf
# with the certbot compose profile.

server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.php;

    client_max_body_size 20m;

    charset utf-8;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Built assets are immutable per deploy (hashed filenames).
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
