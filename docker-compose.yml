name: gymie

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the compose network the services talk by name, never
      # 127.0.0.1 (which would mean "this container").
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
    volumes:
      - app-storage:/var/www/storage/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  webserver:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app-public:/var/www/public:ro
    depends_on:
      - app

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    volumes:
      - app-storage:/var/www/storage/app
    depends_on:
      - app

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--max-time=3600"]
    volumes:
      - app-storage:/var/www/storage/app
    depends_on:
      - app

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - app-storage:/var/www/storage/app
    depends_on:
      - app

  backup:
    # Alpine + MariaDB client (speaks caching_sha2_password to MySQL 8) +
    # busybox crond. Nightly 03:00 single-transaction dump into a dedicated
    # volume, independent of the live DB volume (disaster recovery + prod
    # data copies for dev/migration testing - Phase 10.5).
    image: alpine:3.21
    restart: unless-stopped
    environment:
      MYSQL_PWD: ${DB_PASSWORD}
    volumes:
      - backups:/backups
    command: >
      /bin/sh -c '
      apk add --no-cache mariadb-client >/dev/null
      && echo "0 3 * * * mysqldump -h db -u root --single-transaction ${DB_DATABASE} > /backups/${DB_DATABASE}-\$$(date +%Y%m%d).sql" > /etc/crontabs/root
      && crond -f -l 2'
    depends_on:
      db:
        condition: service_healthy

  # HTTPS profile (DuckDNS + Let's Encrypt): docker compose --profile https up
  # Requires DUCKDNS_DOMAIN + DUCKDNS_TOKEN in .env and nginx-tls.conf swapped
  # into the webserver service (see README "Production (Docker)").
  certbot:
    image: certbot/certbot
    profiles: ["https"]
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >
      /bin/sh -c '
      trap exit TERM;
      certbot certonly --webroot -w /var/www/certbot
        -d ${DUCKDNS_DOMAIN}.duckdns.org
        --email ${LETSENCRYPT_EMAIL} --agree-tos --no-eff-email --non-interactive
      ;
      while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'
    depends_on:
      - webserver

volumes:
  db-data:
  redis-data:
  app-storage:
  app-public:
  backups:
  certbot-etc:
  certbot-www:
