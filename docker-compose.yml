name: gymie

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME}
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the compose network the services talk by name, never
      # 127.0.0.1 (which would mean "this container").
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      # PHP broadcaster must reach Reverb over the internal Docker network,
      # not the public hostname (which the .env sets for client-side Echo).
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    volumes:
      - app-storage:/var/www/storage/app
      # Settings JSON (currency, taxes, notification prefs) must survive
      # container recreates - storage/data is otherwise container-ephemeral.
      - app-settings:/var/www/storage/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  webserver:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app-public:/var/www/public:ro
      # Member photos / uploads live in app-storage. The public/ build tree
      # carries a `storage` symlink -> /var/www/storage/app/public (created by
      # `php artisan storage:link` in the app container), so nginx must have
      # the same volume mounted at the same path to serve those files.
      - app-storage:/var/www/storage/app:ro
    depends_on:
      - app

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME}
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    volumes:
      - app-storage:/var/www/storage/app
    depends_on:
      - app

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      # PHP broadcaster must reach Reverb over the internal Docker network,
      # not the public hostname (which the .env sets for client-side Echo).
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--max-time=3600"]
    volumes:
      - app-storage:/var/www/storage/app
      - app-settings:/var/www/storage/data
    depends_on:
      - app

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      # PHP broadcaster must reach Reverb over the internal Docker network,
      # not the public hostname (which the .env sets for client-side Echo).
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - app-storage:/var/www/storage/app
      - app-settings:/var/www/storage/data
    depends_on:
      - app

  backup:
    # Alpine + MariaDB client (speaks caching_sha2_password to MySQL 8) +
    # busybox crond. Nightly 03:00 single-transaction dump into a dedicated
    # volume, independent of the live DB volume (disaster recovery + prod
    # data copies for dev/migration testing - Phase 10.5). Dumps older than
    # 14 days are pruned at 03:30 so the volume cannot fill the disk.
    image: alpine:3.21
    restart: unless-stopped
    environment:
      MYSQL_PWD: ${DB_PASSWORD}
    volumes:
      - backups:/backups
    command: >
      /bin/sh -c '
      apk add --no-cache mariadb-client >/dev/null
      && echo "0 3 * * * mysqldump -h db -u root --single-transaction ${DB_DATABASE} > /backups/${DB_DATABASE}-\$$(date +%Y%m%d).sql" > /etc/crontabs/root
      && echo "30 3 * * * find /backups -type f -name \"*.sql\" -mtime +13 -delete" >> /etc/crontabs/root
      && crond -f -l 2'
    depends_on:
      db:
        condition: service_healthy

  # HTTPS profile (DuckDNS + Let's Encrypt): docker compose --profile https up
  # Requires DUCKDNS_DOMAIN + DUCKDNS_TOKEN in .env and nginx-tls.conf swapped
  # into the webserver service (see README "Production (Docker)").
  certbot:
    image: certbot/certbot
    profiles: ["https"]
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >
      /bin/sh -c '
      trap exit TERM;
      certbot certonly --webroot -w /var/www/certbot
        -d ${DUCKDNS_DOMAIN}.duckdns.org
        --email ${LETSENCRYPT_EMAIL} --agree-tos --no-eff-email --non-interactive
      ;
      while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'
    depends_on:
      - webserver

volumes:
  db-data:
    name: gymie_db-data
    external: true
  redis-data:
  app-storage:
  app-public:
  app-settings:
  backups:
  certbot-etc:
  certbot-www:
