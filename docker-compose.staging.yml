name: gymie-staging
# Staging must be invoked with --env-file .env.staging so ${} interpolation
# uses staging values, e.g.:
# docker compose --env-file .env.staging -f docker-compose.yml -f docker-compose.staging.yml -p gymie-staging up -d
# Base production services (db, backup, webserver, redis, reverb) are disabled
# below so staging can never mount the production gymie_db-data volume.

services:
  app:
    extends:
      file: docker-compose.yml
      service: app
    env_file: .env.staging
    environment:
      DB_HOST: db-staging
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis-staging
      REVERB_HOST: reverb-staging
    volumes:
      - app-storage-staging:/var/www/storage/app
    depends_on:
      db:
        condition: service_healthy
        required: false
      redis:
        condition: service_started
        required: false
      db-staging:
        condition: service_healthy
      redis-staging:
        condition: service_started

  webserver-staging:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
      - "${HTTPS_PORT:-8444}:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app-public-staging:/var/www/public:ro
      - app-storage-staging:/var/www/storage/app:ro
    depends_on:
      - app

  db:
    profiles: ["disabled"]

  backup:
    profiles: ["disabled"]

  webserver:
    profiles: ["disabled"]

  redis:
    profiles: ["disabled"]

  reverb:
    profiles: ["disabled"]

  db-staging:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data-staging:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis-staging:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data-staging:/data

  reverb-staging:
    extends:
      file: docker-compose.yml
      service: reverb
    env_file: .env.staging
    environment:
      DB_HOST: db-staging
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis-staging
    volumes:
      - app-storage-staging:/var/www/storage/app
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]

  queue:
    extends:
      file: docker-compose.yml
      service: queue
    env_file: .env.staging
    environment:
      DB_HOST: db-staging
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis-staging
      REVERB_HOST: reverb-staging
    depends_on:
      db-staging:
        condition: service_healthy
      redis-staging:
        condition: service_started
    volumes:
      - app-storage-staging:/var/www/storage/app

  scheduler:
    extends:
      file: docker-compose.yml
      service: scheduler
    env_file: .env.staging
    environment:
      DB_HOST: db-staging
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis-staging
      REVERB_HOST: reverb-staging
    depends_on:
      db-staging:
        condition: service_healthy
      redis-staging:
        condition: service_started
    volumes:
      - app-storage-staging:/var/www/storage/app

volumes:
  db-data-staging:
  redis-data-staging:
  app-storage-staging:
  app-public-staging:
