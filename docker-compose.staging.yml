name: gymie-staging

services:
  app:
    extends:
      file: docker-compose.yml
      service: app
    env_file: .env.staging
    environment:
      DB_HOST: db-staging
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis-staging
      REVERB_HOST: reverb-staging
    volumes:
      - app-storage-staging:/var/www/storage/app

  webserver-staging:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8444}:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app-public-staging:/var/www/public:ro
      - app-storage-staging:/var/www/storage/app:ro
    depends_on:
      - app

  db-staging:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data-staging:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis-staging:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data-staging:/data

  reverb-staging:
    extends:
      file: docker-compose.yml
      service: reverb
    env_file: .env.staging
    environment:
      DB_HOST: db-staging
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis-staging
    volumes:
      - app-storage-staging:/var/www/storage/app
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]

volumes:
  db-data:
    name: gymie-staging_db-data-isolated
  db-data-staging:
  redis-data-staging:
  app-storage-staging:
  app-public-staging:
